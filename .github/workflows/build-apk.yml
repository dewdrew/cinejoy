name: Build Cinejoy APK

# Builds the universal phone + Fire TV APK on a cloud runner.
# No Android Studio is involved: the runner image already ships the Android SDK,
# so the build is plain Gradle.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug + release
    # Pinned rather than ubuntu-latest: that label began migrating to Ubuntu 26 on
    # 2026-10-19, and the new image is where the Android SDK setup broke.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The hosted image provides the Android SDK with licences pre-accepted, so no
      # third-party setup action is needed. Resolving the root explicitly keeps the
      # later steps independent of which variable the image happens to set.
      - name: Locate the Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "No Android SDK found on this runner image." >&2
            exit 1
          fi
          echo "SDK root: $SDK"
          echo "ANDROID_HOME=$SDK"      >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK"  >> "$GITHUB_ENV"
          echo "--- platforms ---"
          ls "$SDK/platforms"   2>/dev/null || echo "(none)"
          echo "--- build-tools ---"
          ls "$SDK/build-tools" 2>/dev/null || echo "(none)"

      - name: Ensure platform 34 and build-tools 34.0.0
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Report APK paths and sizes
        run: |
          echo "### Built APKs" >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs/apk -name '*.apk' -print0 \
            | xargs -0 -I{} sh -c 'echo "- {} ($(du -h "{}" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cinejoy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cinejoy-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
