name: Build Cinejoy APK

# Builds the universal phone + Fire TV APK on a cloud runner.
# The runner already provides the Android SDK and a JDK, so no local
# Android Studio install is involved anywhere in this pipeline.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug + release
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 34 and build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Report APK paths and sizes
        run: |
          echo "### Built APKs" >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs/apk -name '*.apk' -print0 \
            | xargs -0 -I{} sh -c 'echo "- {} ($(du -h "{}" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cinejoy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cinejoy-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
